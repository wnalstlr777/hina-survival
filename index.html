}

// Lightweight procedural ambience, unlocked only by a user click (browser autoplay policy).
// Sound is enabled by default; browsers require an interaction to unlock playback.
let soundEnabled=true,audioCtx=null,ambientTimer=0,chirpClock=0;
let audioUnlockAttached=false;
async function unlockAmbient(){
 if(!soundEnabled)return;
 if(!audioCtx){const C=window.AudioContext||window.webkitAudioContext;if(!C)return;audioCtx=new C();}
 if(audioCtx.state!=='running')await audioCtx.resume();
 ambientTimer=0;
}
function firstInteractionUnlock(){unlockAmbient().catch(()=>{});}
window.addEventListener('pointerdown',firstInteractionUnlock,{passive:true});
window.addEventListener('keydown',firstInteractionUnlock);
function tone(freq,duration,type='sine',volume=.035,delay=0){
 if(!soundEnabled||!audioCtx)return;
 const now=audioCtx.currentTime+delay,osc=audioCtx.createOscillator(),gain=audioCtx.createGain();
 osc.type=type;osc.frequency.setValueAtTime(freq,now);
 gain.gain.setValueAtTime(.0001,now);gain.gain.exponentialRampToValueAtTime(Math.max(.0002,volume),now+.035);
 gain.gain.exponentialRampToValueAtTime(.0001,now+duration);
 osc.connect(gain);gain.connect(audioCtx.destination);osc.start(now);osc.stop(now+duration+.04);
}
function birdCall(){
 const base=randomBetween(1200,1900);
 tone(base,.11,'sine',.022);tone(base*1.23,.10,'sine',.018,.12);tone(base*.91,.16,'sine',.022,.25);
}
function owlCall(){tone(420,.43,'sine',.045);tone(335,.53,'sine',.037,.5);}
function updateSound(dt,isNight){
 if(!soundEnabled||!audioCtx||audioCtx.state!=='running'||paused)return;
 ambientTimer-=dt;
 if(ambientTimer<=0){if(isNight)owlCall();else birdCall();ambientTimer=isNight?randomBetween(5,11):randomBetween(2,5);}
}
$('soundToggle').onclick=async()=>{
 soundEnabled=!soundEnabled;ambientTimer=0;
 if(soundEnabled)await unlockAmbient();
 $('soundToggle').textContent=soundEnabled?'환경음 ON':'환경음 OFF';$('soundToggle').setAttribute('aria-pressed',String(soundEnabled));
};

$('fogToggle').onclick=()=>{fogEnabled=!fogEnabled;$('fogToggle').textContent=fogEnabled?'미탐험 암막 ON':'미탐험 암막 OFF';$('fogToggle').setAttribute('aria-pressed',String(fogEnabled));updateExploration()};$('bubbleToggle').onclick=()=>{bubbleEnabled=!bubbleEnabled;$('bubbleToggle').textContent=bubbleEnabled?'말풍선 ON':'말풍선 OFF';$('bubbleToggle').setAttribute('aria-pressed',String(bubbleEnabled));updateBubble()};$('pause').onclick=()=>{paused=!paused;$('pause').textContent=paused?'재생':'일시정지'};$('speed').onclick=()=>{speed=speed===1?2:speed===2?4:1;$('speed').textContent='속도 ×'+speed};$('reset').onclick=()=>{init();paused=false;$('pause').textContent='일시정지'};window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});init();function animate(t){requestAnimationFrame(animate);let dt=Math.min(.05,(t-prev)/1000);prev=t;update(dt);if(!paused)animateWildlife(t*.001,dt*speed);orbit.update();updateBubble();renderer.render(scene,camera)}requestAnimationFrame(animate);
