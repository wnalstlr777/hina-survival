// Rabbit movement is hop-based: the body travels horizontally during each arc,
// pauses between hops, and always flees away from nearby live snakes.
function animateWildlife(t,dt){
 for(const r of critters){
  if(r.caught)continue;
  const x=r.g.position.x,z=r.g.position.z;
  let danger=null,dangerDistance=Infinity;
  if(!r.pet){
   for(const s of snakes){
    if(!s.active||!s.g.visible)continue;
    const d=Math.hypot(x-s.g.position.x,z-s.g.position.z);
    if(d<9&&d<dangerDistance){danger=s;dangerDistance=d;}
   }
  }
  const torchDanger=torchGroup.visible&&Math.hypot(x-hana.position.x,z-hana.position.z)<TORCH_WILDLIFE_RADIUS;
  const campDanger=fireSuccess&&Math.hypot(x-campfire.position.x,z-campfire.position.z)<CAMPFIRE_WILDLIFE_RADIUS;
  const humanDanger=!r.pet&&Math.hypot(x-hana.position.x,z-hana.position.z)<4.1;
  const fleeing=!r.pet&&(Boolean(danger)||torchDanger||campDanger||humanDanger);
  // Finish a jump before selecting a new direction, avoiding micro-jitter.
  if(!r.hopActive&&t>=r.restUntil){
   let dx=0,dz=0;
   if(r.pet){
    const tx=hana.position.x-Math.sin(hana.rotation.y)*1.65;
    const tz=hana.position.z-Math.cos(hana.rotation.y)*1.65;
    dx=tx-x;dz=tz-z;
    if(Math.hypot(dx,dz)<.85){r.restUntil=t+.4;continue;}
   }else if(danger){dx=x-danger.g.position.x;dz=z-danger.g.position.z;}
   else if(torchDanger){dx=x-hana.position.x;dz=z-hana.position.z;}
   else if(campDanger){dx=x-campfire.position.x;dz=z-campfire.position.z;}
   else if(humanDanger){dx=x-hana.position.x;dz=z-hana.position.z;}
   else{
    // Short roaming hops with a gentle pull toward the habitat.
    const wander=r.phase+Math.sin(t*.27+r.phase)*1.5;
    dx=Math.sin(wander)+(r.homeX-x)*.16;
    dz=Math.cos(wander)+(r.homeZ-z)*.16;
   }
   const d=Math.hypot(dx,dz)||1;dx/=d;dz/=d;
   const length=r.pet?1.05:fleeing?1.6:.85;
   let nx=x+dx*length,nz=z+dz*length;
   if(!landAt(nx,nz)||(!r.pet&&!fleeing&&Math.hypot(nx-r.homeX,nz-r.homeZ)>7)){
    const toward=Math.atan2(r.homeX-x,r.homeZ-z);
    nx=x+Math.sin(toward)*.7;nz=z+Math.cos(toward)*.7;
   }
   if(landAt(nx,nz)){
    r.hopFromX=x;r.hopFromZ=z;r.hopToX=nx;r.hopToZ=nz;
    r.hopClock=0;r.hopDuration=fleeing?.32:r.pet?.39:.46;
    r.hopActive=true;r.heading=Math.atan2(nx-x,nz-z);
    r.g.rotation.y=r.heading;
   }else r.restUntil=t+.35;
  }
  if(r.hopActive){
   r.hopClock+=dt;
   const p=Math.min(1,r.hopClock/r.hopDuration);
   // Continuous forward displacement + one clean ballistic hop.
   const smooth=p*p*(3-2*p);
   r.g.position.x=r.hopFromX+(r.hopToX-r.hopFromX)*smooth;
   r.g.position.z=r.hopFromZ+(r.hopToZ-r.hopFromZ)*smooth;
   r.g.position.y=rabbitGroundY(r.g.position.x,r.g.position.z)+.04+Math.sin(p*Math.PI)*(fleeing?.39:.30);
   if(p>=1){r.hopActive=false;r.restUntil=t+(fleeing?.07:r.pet?.20:.65+Math.random()*.95);}
  }else r.g.position.y=rabbitGroundY(x,z)+.04;
 }
 for(const f of fishes){
  const a=t*.52+f.phase;
  f.g.position.x=f.x+Math.cos(a)*(.5+Math.sin(f.phase)*.24);
  f.g.position.z=f.z+Math.sin(a)*(.4+Math.cos(f.phase)*.15);
  f.g.position.y=-.30+Math.sin(t*2.4+f.phase)*.035;
  f.g.rotation.y=-a;
  f.tail.rotation.y=Math.sin(t*12+f.phase)*.5;
 }
}
