  turnTowards(Math.atan2(dx,dz),step);
  const k=Math.min(1,step*2.8);
  const nx=hana.position.x+dx*k,nz=hana.position.z+dz*k;
  if(!navBlocked(nx,nz)){hana.position.x=nx;hana.position.z=nz;}
  walkPose(step,true);

    setState('returnHesitate','탐험 중 귀환을 망설임',null,need==='thirst'?'물이 있는 곳까지 꽤 먼데... 조금만 더 둘러볼까?':'열매나무까지 돌아가야 하나... 아쉽지만 배가 고파.');
   }else{
    setState(need==='thirst'?'drinkTravel':'eatTravel',need==='thirst'?'탐험 중단 · 물가로 귀환':'탐험 중단 · 열매 채집',destination,
      need==='thirst'?'이제 안 되겠어. 탐험은 나중에 하고 물부터 마시자.':'배가 너무 고파... 여기까지 왔지만 탐험을 포기하고 돌아가자.');
   }
  }
 }
 if(target){
  const finalDistance=Math.hypot(target.x-hana.position.x,target.z-hana.position.z);
  if(finalDistance<.7){target=null;navReset();walkPose(step,false);}
  else{
   if(!navGoal||navGoal.distanceToSquared(target)>.1||(!navPath.length&&elapsed>navReplanAt)){
    navGoal=target.clone();navPath=navBuild(hana.position,target);navReplanAt=elapsed+7;
   }
   // An unreachable point is never approached by walking through an obstacle.
   if(!navPath.length){
    walkPose(step,false);
    if(elapsed>navReplanAt){
     navReplanAt=elapsed+9;
     log('높은 지형에 길이 막혀 다른 경로를 찾는 중');
     say('여기는 못 지나가겠어... 돌아가는 길을 찾아보자.');
    }
   }else{
    const waypoint=navPath[0],dx=waypoint.x-hana.position.x,dz=waypoint.z-hana.position.z;
    const dist=Math.hypot(dx,dz);
    if(dist<.38){navPath.shift();}
    else{
     const movement=Math.min(dist,step*1.8*(stats.energy<25?.52:stats.energy<45?.76:1));
     const nx=hana.position.x+dx/dist*movement,nz=hana.position.z+dz/dist*movement;
     if(!navBlocked(nx,nz)){
      hana.position.x=nx;hana.position.z=nz;
      turnTowards(Math.atan2(dx,dz),step);
      walkPose(step,true);navStuck=0;
     }else{
      navStuck+=step;walkPose(step,false);
      if(navStuck>.7){navPath=[];navGoal=null;navReplanAt=elapsed+1;navStuck=0;}
     }
    }
   }
  }
 }else {
  if(day===1&&(state==='confused'||state==='orient'))updateIntroMovement(step);
  else {walkPose(step,false);head.rotation.y=0;}
 }
 decide();
 updateCharacterPose();
 updateExploration();
 updateDetailVisibility();
 updateBerryTrees();
 const visited=explored.size;
 if(visited>previousExplorationCount+28&&elapsed>discoveryBoostAt+45){
  previousExplorationCount=visited;discoveryBoostAt=elapsed;
  changeWill(randomBetween(3,5),'새로운 지역 발견');
 }
 const t=clockParts();
 $('dayLabel').textContent=`· DAY ${String(t.day).padStart(2,'0')}`;
 $('clock').textContent=`${String(t.h).padStart(2,'0')}:${String(t.m).padStart(2,'0')}`;
 $('elapsed').textContent=`D${t.day} ${String(Math.floor(elapsed/60)).padStart(2,'0')}:${String(Math.floor(elapsed%60)).padStart(2,'0')}`;
 waterSurface.position.y=-.52+Math.sin(elapsed*.8)*.035;
 pondWater.position.y=.19+Math.sin(elapsed*1.1)*.006;
 pondRipples.forEach((r,i)=>{const pulse=(elapsed*.16+i*.24)%1;r.scale.setScalar(.6+pulse*.55);r.material.opacity=.6;});
 waveMat.opacity=.15+Math.sin(elapsed*1.7)*.09;
 const dayLight=Math.max(.06,Math.sin(t.dayTime/DAY_SECONDS*Math.PI*2+.38)*.48+.52);
 for(const mote of motes)mote.visible=dayLight<.4;
 scene.background.setRGB(.07+dayLight*.53,.12+dayLight*.71,.22+dayLight*.69);
 scene.fog.color.copy(scene.background);sun.intensity=.15+dayLight*2.3;
 ambient.intensity=.35+dayLight*1.8;
 weatherUpdate(step);updateSound(dt,dayLight<.25);updateCampfire(elapsed);
 // Cool, blue rainy light without changing individual material colors permanently.
 const cool=raining()?0.72:groundWet()?0.91:1;
 scene.background.setRGB((.07+dayLight*.53)*cool,(.12+dayLight*.71)*(.95+.05*cool),(.22+dayLight*.69)*1.04);
 scene.fog.color.copy(scene.background);
 sun.color.setRGB(cool,.94,1);
 ambient.color.setRGB(.82*cool,.91,1);
 if(raining())ambient.intensity*=.82;
 if(elapsed>=uiNextUpdate){uiNextUpdate=elapsed+.3;
 $('stats').innerHTML=Object.entries({체력:stats.energy,갈증:stats.thirst,허기:stats.hunger,의지력:stats.will,불경험:Math.min(100,fireKnowledge)})
 .map(([k,v])=>`<div class="stat"><label>${k}</label><div class="bar"><div class="fill" style="width:${v}%;background:${v<30?'#db826f':v<55?'#d8b65b':'#68d3b1'}"></div></div><span class="val">${Math.round(v)}</span></div>`).join('');
 }
}

// Lightweight procedural ambience, unlocked only by a user click (browser autoplay policy).
// Sound is enabled by default; browsers require an interaction to unlock playback.
let soundEnabled=true,audioCtx=null,ambientTimer=0,chirpClock=0;
let audioUnlockAttached=false;
async function unlockAmbient(){
 if(!soundEnabled)return;
 if(!audioCtx){const C=window.AudioContext||window.webkitAudioContext;if(!C)return;audioCtx=new C();}
 if(audioCtx.state!=='running')await audioCtx.resume();
 ambientTimer=0;
}
function firstInteractionUnlock(){unlockAmbient().catch(()=>{});}
window.addEventListener('pointerdown',firstInteractionUnlock,{passive:true});
window.addEventListener('keydown',firstInteractionUnlock);
function tone(freq,duration,type='sine',volume=.035,delay=0){
 if(!soundEnabled||!audioCtx)return;
 const now=audioCtx.currentTime+delay,osc=audioCtx.createOscillator(),gain=audioCtx.createGain();
 osc.type=type;osc.frequency.setValueAtTime(freq,now);
 gain.gain.setValueAtTime(.0001,now);gain.gain.exponentialRampToValueAtTime(Math.max(.0002,volume),now+.035);
 gain.gain.exponentialRampToValueAtTime(.0001,now+duration);
 osc.connect(gain);gain.connect(audioCtx.destination);osc.start(now);osc.stop(now+duration+.04);
}
function birdCall(){
 const base=randomBetween(1200,1900);
 tone(base,.11,'sine',.022);tone(base*1.23,.10,'sine',.018,.12);tone(base*.91,.16,'sine',.022,.25);
}
function owlCall(){tone(420,.43,'sine',.045);tone(335,.53,'sine',.037,.5);}
function updateSound(dt,isNight){
 if(!soundEnabled||!audioCtx||audioCtx.state!=='running'||paused)return;
 ambientTimer-=dt;
 if(ambientTimer<=0){if(isNight)owlCall();else birdCall();ambientTimer=isNight?randomBetween(5,11):randomBetween(2,5);}
}
$('soundToggle').onclick=async()=>{
 soundEnabled=!soundEnabled;ambientTimer=0;
 if(soundEnabled)await unlockAmbient();
 $('soundToggle').textContent=soundEnabled?'환경음 ON':'환경음 OFF';$('soundToggle').setAttribute('aria-pressed',String(soundEnabled));
};

$('mobileMenu').onclick=()=>{

 $('mobileMenu').setAttribute('aria-expanded',String(open));
 $('mobileMenu').textContent=open?'✕ 닫기':'☰ 메뉴';
};

function focusHina(){

 if(offset.length()<6)offset.set(9,9,14);

 orbit.target.copy(focus);
