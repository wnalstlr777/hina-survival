 const now=audioCtx.currentTime+delay,osc=audioCtx.createOscillator(),gain=audioCtx.createGain();
 osc.type=type;osc.frequency.setValueAtTime(freq,now);
 gain.gain.setValueAtTime(.0001,now);gain.gain.exponentialRampToValueAtTime(Math.max(.0002,volume),now+.035);
 gain.gain.exponentialRampToValueAtTime(.0001,now+duration);
 osc.connect(gain);gain.connect(audioCtx.destination);osc.start(now);osc.stop(now+duration+.04);
}
function birdCall(){
 const base=randomBetween(1200,1900);
 tone(base,.11,'sine',.022);tone(base*1.23,.10,'sine',.018,.12);tone(base*.91,.16,'sine',.022,.25);
}
function owlCall(){tone(420,.43,'sine',.045);tone(335,.53,'sine',.037,.5);}
function updateSound(dt,isNight){

// v4.6: One consistent, screen-space fade for all occluding opaque scenery.
// A shared focus/radius and identical alpha curve prevent per-mesh opacity differences.
const occlusionAim=new THREE.Vector3(),occlusionFocusPx=new THREE.Vector2();
const occlusionBufferSize=new THREE.Vector2(),occlusionWorldPos=new THREE.Vector3();
const fadedMeshes=new Map(),occlusionCandidates=new Set();
const occlusionUniforms={focus:{value:occlusionFocusPx},radius:{value:1}};
let nextOcclusionCheck=0;
function makeSoftOcclusionMaterial(original){
 const material=original.clone();
 material.transparent=true;
 material.depthWrite=false;
 // Keep the original surface color, but use a single common fade curve for every mesh.
 const previous=material.onBeforeCompile;
 material.onBeforeCompile=(shader,webglRenderer)=>{
  if(previous)previous(shader,webglRenderer);
  shader.uniforms.uHinaFocus=occlusionUniforms.focus;
  shader.uniforms.uHinaRadius=occlusionUniforms.radius;
  shader.fragmentShader='uniform vec2 uHinaFocus;\nuniform float uHinaRadius;\n'+shader.fragmentShader;
  shader.fragmentShader=shader.fragmentShader.replace('#include <opaque_fragment>',
   '#include <opaque_fragment>\n float hinaFade = smoothstep(uHinaRadius * 0.30, uHinaRadius, distance(gl_FragCoord.xy, uHinaFocus));\n gl_FragColor.a = hinaFade;');
 };
 material.customProgramCacheKey=()=> 'hina-unified-soft-occlusion-v46';
 return material;
}
function updateCameraOcclusion(now){
 renderer.getDrawingBufferSize(occlusionBufferSize);
 occlusionAim.copy(hana.position);occlusionAim.y+=1.2;
 const projectedFocus=occlusionAim.clone().project(camera);
 occlusionFocusPx.set((projectedFocus.x*.5+.5)*occlusionBufferSize.x,(projectedFocus.y*.5+.5)*occlusionBufferSize.y);
 // Radius in drawing-buffer pixels, independent of individual actor size or material.
 const radius=Math.min(occlusionBufferSize.x,occlusionBufferSize.y)*0.34;
 occlusionUniforms.radius.value=Math.max(1,radius);
 if(now<nextOcclusionCheck)return;
 nextOcclusionCheck=now+(ultraLowPower?500:isMobile?300:175);
 const focusDepth=occlusionAim.distanceTo(camera.position);
 const viewHeight=occlusionBufferSize.y;
 const perspectiveFactor=viewHeight/(2*Math.tan(THREE.MathUtils.degToRad(camera.fov)*.5));
 occlusionCandidates.clear();
 scene.updateMatrixWorld(false);
 for(const mesh of cameraOccluders){
  if(!mesh.visible||!mesh.geometry||!mesh.geometry.boundingSphere)continue;
  mesh.getWorldPosition(occlusionWorldPos);
  const depth=occlusionWorldPos.distanceTo(camera.position);
  const scale=mesh.getWorldScale(new THREE.Vector3());
  const sphere=mesh.geometry.boundingSphere.radius*Math.max(scale.x,scale.y,scale.z);
  if(depth-sphere>focusDepth+.5||depth+sphere<.2)continue;
  const p=occlusionWorldPos.clone().project(camera);
  if(p.z>1||p.z< -1)continue;
  const px=(p.x*.5+.5)*occlusionBufferSize.x;
  const py=(p.y*.5+.5)*viewHeight;
  const projectedRadius=sphere*perspectiveFactor/Math.max(1,depth);
  // Generous overlap buffer avoids visible hard-edged parts at the circular fade boundary.
  if(Math.hypot(px-occlusionFocusPx.x,py-occlusionFocusPx.y)<radius+projectedRadius+24){
   occlusionCandidates.add(mesh);
  }
 }
 for(const mesh of occlusionCandidates){
  if(fadedMeshes.has(mesh))continue;
  // Do not replace translucent water, particles, or special-purpose shaders.
  const original=mesh.material;
  if(!original||Array.isArray(original)||original.transparent)continue;
  mesh.material=makeSoftOcclusionMaterial(original);
  fadedMeshes.set(mesh,original);
 }
 for(const [mesh,original] of fadedMeshes){
  if(occlusionCandidates.has(mesh))continue;
  mesh.material.dispose();mesh.material=original;fadedMeshes.delete(mesh);
 }
}
function setCameraMode(on){
 followCamera=on;orbit.enabled=!on;
 $('cameraMode').textContent=on?'카메라: 팔로우':'카메라: 자유';
 $('cameraMode').setAttribute('aria-pressed',String(on));
 if(on){followOffset.set(12,13,12).normalize().multiplyScalar(followDistance);followFocus.copy(hana.position).add(new THREE.Vector3(0,1.25,0));
   orbit.target.copy(followFocus);camera.position.copy(followFocus).add(followOffset);camera.lookAt(followFocus);}

}

// OrbitControls is disabled in follow mode, so handle its wheel separately.
renderer.domElement.addEventListener('wheel',e=>{
 if(!followCamera)return;
 e.preventDefault();
 const scale=Math.exp(Math.sign(e.deltaY)*Math.min(Math.abs(e.deltaY),160)*.0017);
 followDistance=THREE.MathUtils.clamp(followDistance*scale,5.8,52);
 followOffset.set(12,13,12).normalize().multiplyScalar(followDistance);
},{passive:false});
// On tablets a two-finger pinch zooms the following camera as well.
let followPinchDistance=0;
renderer.domElement.addEventListener('touchstart',e=>{
 if(!followCamera||e.touches.length!==2)return;
 followPinchDistance=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
},{passive:true});
renderer.domElement.addEventListener('touchmove',e=>{
 if(!followCamera||e.touches.length!==2)return;
 const dist=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
 if(followPinchDistance>0&&dist>0){
  e.preventDefault();followDistance=THREE.MathUtils.clamp(followDistance*followPinchDistance/dist,5.8,52);
  followOffset.set(12,13,12).normalize().multiplyScalar(followDistance);
 }
 followPinchDistance=dist;
},{passive:false});
renderer.domElement.addEventListener('touchend',e=>{if(e.touches.length<2)followPinchDistance=0;},{passive:true});
// F: snap camera to Hina while preserving the current orbit viewing angle.
function focusHina(){
 if(followCamera){setCameraMode(true);return;}
 const offset=camera.position.clone().sub(orbit.target);
 // Keep the viewing direction, but always move to a close character shot.
 if(offset.lengthSq()<.001)offset.set(0,4,8);
 offset.normalize().multiplyScalar(8.5);
 offset.y=Math.max(3.1,Math.min(5.5,offset.y));
 const focus=hana.position.clone().add(new THREE.Vector3(0,1.25,0));
 orbit.target.copy(focus);
 camera.position.copy(focus).add(offset);
 orbit.update();
}

 init();

 fishObservations=3;fishAttempts=2;fishSkill=49;fishSpear=false;lastFishDay=0;
 storedFish=[];rainWater=1;waterVessel=true;

 // Pre-reveal a coherent region near the known camp rather than scattered fog tiles.
 const revealCount=Math.floor(fogTiles.length*.23);
 const cx=sites.shelter.x,cz=sites.shelter.z;
 const ordered=[...fogTiles].sort((a,b)=>{
  const da=Math.min(Math.hypot(a.x-9,a.z-5),Math.hypot(a.x-cx,a.z-cz));
  const db=Math.min(Math.hypot(b.x-9,b.z-5),Math.hypot(b.x-cx,b.z-cz));

 });

 log('🧪 DAY 10 예시 상태 적용 · 토끼 패턴 100, 생존 자원·탐험·물고기·제작 학습 포함');
